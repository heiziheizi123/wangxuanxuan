<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新城关小学吧-百度贴吧</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; background-color: #dee4ed; color: #333; }
        
        /* 顶部蓝色导航条与搜索栏 */
        .top-blue-bar { background: #2d8cf0; color: #fff; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .top-blue-bar .logo { font-size: 16px; font-weight: bold; flex-shrink: 0; text-decoration: none; color: #fff; }
        .search-form { flex: 1; display: flex; align-items: center; background: #fff; border-radius: 4px; padding: 4px 8px; }
        .search-input { width: 100%; border: none; outline: none; font-size: 13px; color: #333; padding: 2px 4px; }
        .search-btn { background: none; border: none; cursor: pointer; font-size: 16px; padding: 0 4px; display: flex; align-items: center; justify-content: center; }

        /* 吧Header区域 - 点击头像或名字进入 chengguan.html */
        .bar-header-link { text-decoration: none; color: inherit; display: block; }
        .bar-header { background: #fff; padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #d1d7e2; }
        .bar-avatar { width: 55px; height: 55px; background: #4ba3e3; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; font-weight: bold; text-align: center; line-height: 1.3; box-shadow: inset 0 0 5px rgba(0,0,0,0.2); }
        .bar-info { margin-left: 12px; flex: 1; }
        .bar-name { font-size: 18px; font-weight: bold; color: #000; display: flex; align-items: center; }
        .bar-name::after { content: "＋关注"; font-size: 11px; background: #ff4d4f; color: #fff; padding: 2px 6px; border-radius: 3px; margin-left: 8px; font-weight: normal; }
        .bar-stats { font-size: 11px; color: #777; margin-top: 4px; }

        /* 导航栏 */
        .nav-tabs { display: flex; background: #fff; border-bottom: 1px solid #d1d7e2; font-size: 14px; }
        .tab-item { flex: 1; text-align: center; padding: 12px 0; color: #666; position: relative; }
        .tab-item.active { color: #2d8cf0; font-weight: bold; }
        .tab-item.active::after { content: ""; position: absolute; bottom: 0; left: 35%; width: 30%; height: 3px; background: #2d8cf0; border-radius: 2px; }

        /* 广告区域 */
        .ad-banner-1 { background: #fff; padding: 8px 10px; margin-top: 5px; border-bottom: 1px solid #d1d7e2; }
        .ad-banner-1 img { width: 100%; height: auto; border-radius: 4px; display: block; }

        /* 帖子标题区 */
        .main-post-title { background: #fff; padding: 15px 15px 10px 15px; margin-top: 8px; font-size: 18px; font-weight: bold; color: #000; border-bottom: 1px solid #f0f0f0; line-height: 1.4; }

        /* 楼层基本样式 */
        .floor { background: #fff; padding: 15px; border-bottom: 1px solid #ecf0f5; }
        .floor-header { display: flex; align-items: center; margin-bottom: 10px; font-size: 13px; }
        
        /* 圆形头像 - 点击跳转登录 */
        .avatar-link { text-decoration: none; display: block; flex-shrink: 0; margin-right: 10px; }
        .avatar-placeholder { width: 32px; height: 32px; background: #ccc; border-radius: 50%; cursor: pointer; transition: opacity 0.2s; }
        .avatar-placeholder:hover { opacity: 0.85; }

        .user-info { flex: 1; }
        .username { font-weight: bold; color: #444; }
        .lz-badge { background: #2d8cf0; color: #fff; font-size: 9px; padding: 1px 3px; border-radius: 2px; margin-left: 4px; vertical-align: middle; }
        .floor-num { color: #999; }
        .floor-content { font-size: 15px; color: #111; word-break: break-all; margin-top: 4px; line-height: 1.6; }

        /* 底部广告 */
        .ad-box-2 { background: #fff; margin: 8px 0; padding: 12px; display: flex; align-items: center; border-top: 1px solid #d1d7e2; border-bottom: 1px solid #d1d7e2; background-color: #fcfdfe; }
        .ad-box-2 .ad-img-container { width: 50px; height: 50px; margin-right: 12px; flex-shrink: 0; }
        .ad-box-2 .ad-img-container img { width: 100%; height: 100%; border-radius: 8px; object-fit: cover; }
        .ad-box-2 .ad-text { flex: 1; }
        .ad-box-2 .ad-title { font-size: 14px; font-weight: bold; color: #333; }
        .ad-box-2 .ad-desc { font-size: 12px; color: #888; margin-top: 2px; }
        .ad-box-2 .ad-btn { font-size: 12px; border: 1px solid #2d8cf0; color: #2d8cf0; padding: 4px 8px; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- 顶部蓝色导航条与搜索栏 -->
    <div class="top-blue-bar">
        <a href="#" class="logo">百度贴吧</a>
        <form action="search.html" method="GET" class="search-form">
            <input type="text" name="kw" placeholder="搜索贴吧内帖子..." class="search-input" required>
            <button type="submit" class="search-btn">🔍</button>
        </form>
    </div>

    <!-- 吧Header区域 -->
    <a href="chengguan.html" class="bar-header-link">
        <div class="bar-header">
            <div class="bar-avatar">新城关<br>小学吧</div>
            <div class="bar-info">
                <div class="bar-name">新城关小学吧</div>
                <div class="bar-stats">关注：124 &nbsp; 帖子：12</div>
            </div>
        </div>
    </a>

    <div class="nav-tabs">
        <div class="tab-item active">看帖</div>
        <div class="tab-item">图片</div>
        <div class="tab-item">精品</div>
    </div>

    <div class="ad-banner-1">
        <img src="image_4.jpg" alt="江州市宠物之家广告">
    </div>

    <div class="main-post-title">
        【7】以前小卖部五毛钱的辣条
    </div>

    <!-- 1楼 -->
    <div class="floor">
        <div class="floor-header">
            <a href="#" class="avatar-link" title="用户头像">
                <div class="avatar-placeholder" style="background: #ff9900;"></div>
            </a>
            <div class="user-info">
                <div class="username">辣条批发商<span class="lz-badge">楼主</span></div>
            </div>
            <div class="floor-num">1楼</div>
        </div>
        <div class="floor-content">
            叫什么大刀肉还是啥来着，现在超市卖的那种完全不是一个味。
        </div>
    </div>

    <!-- 2楼 -->
    <div class="floor">
        <div class="floor-header">
            <a href="#" class="avatar-link" title="用户头像">
                <div class="avatar-placeholder" style="background: #5cadff;"></div>
            </a>
            <div class="user-info">
                <div class="username">泡泡2308</div>
            </div>
            <div class="floor-num">2楼</div>
        </div>
        <div class="floor-content">
            你是那个偷偷给学生塞零食卖的吗，不好吃了也不买你的，都是三无产品！
        </div>
    </div>

    <div class="ad-box-2">
        <div class="ad-img-container">
            <img src="image_3.jpg" alt="广告图标">
        </div>
        <div class="ad-text">
            <div class="ad-title">同城扩列聊天软件</div>
            <div class="ad-desc">来新城关小学吧，和志同道合的人一起畅聊</div>
        </div>
        <div class="ad-btn">下载</div>
    </div>

    <div style="text-align: center; padding: 20px; font-size: 11px; color: #8f9bb3;">
        ©2026 Baidu 贴吧客户端复古精简版
    </div>

</body>
</html>
