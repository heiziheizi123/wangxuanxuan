<div class="floor"><div class="floor-header"><a href="#" class="avatar-link"><div class="avatar-placeholder" style="background:#F59E0B">星</div></a><div class="user-info"><div><a href="xinglover.html" class="username">看星星的人</a><span class="lz-badge">楼主</span></div><div class="floor-num-time"><span>1楼</span><span>2023-06-10 20:43</span></div></div></div><div class="floor-content">从小学就开始了。同校不同班，知道她叫什么，她不知道我。后来她好像转学了，或者搬家了，反正找不到了。中间几年没想过，最近又想起来。翻了她以前在网上发过的东西，发现她好像过得不太好。我也不知道能做什么。就想知道她在哪。有人有过这种经历吗。就是很久以前认识的一个人，突然很想找到她。</div></div>
