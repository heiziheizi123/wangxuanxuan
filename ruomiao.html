<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>若苗王教官太帅了吧</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
            background-color: #dee4ed;
            color: #333;
        }

        .post-container {
            max-width: 1000px;
            margin: 20px auto;
            background: #fff;
            border: 1px solid #e1e4e6;
        }

        .post-title-bar {
            padding: 15px 20px;
            border-bottom: 1px solid #e4e6eb;
            background: #fcfcfc;
        }

        .post-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .floor-row {
            display: flex;
            border-bottom: 1px solid #e4e6eb;
        }

        .user-info-col {
            width: 130px;
            background: #fafafa;
            padding: 15px 10px;
            text-align: center;
            border-right: 1px solid #e4e6eb;
            flex-shrink: 0;
        }

        .avatar-mock {
            width: 60px;
            height: 60px;
            background: #ebdbe6;
            border-radius: 4px;
            margin: 0 auto 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #999;
            user-select: none;
        }

        .username-link {
            color: #2d8cf0;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            word-break: break-all;
            display: block;
        }

        .content-col {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 500px;
        }

        .post-text {
            font-size: 14px;
            color: #333;
            line-height: 1.8;
            word-break: break-all;
        }

        .post-image {
            display: block;
            max-width: 500px;
            max-height: 500px;
            margin-top: 20px;
            border: 1px solid #e4e6eb;
            object-fit: contain;
        }

        .floor-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            font-size: 12px;
            color: #999;
        }

        .client-tail {
            color: #666;
        }

        .floor-actions span {
            margin-left: 15px;
            cursor: pointer;
        }

        .floor-actions span:hover {
            color: #2d8cf0;
        }

        @media (max-width: 700px) {
            .post-container {
                margin: 10px;
            }

            .user-info-col {
                width: 100px;
            }

            .content-col {
                padding: 15px;
            }

            .post-image {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="post-container">

        <div class="post-title-bar">
            <h1 class="post-title">若苗王教官太帅了吧</h1>
        </div>

        <div class="floor-row">

            <div class="user-info-col">
                <div class="avatar-mock">👩</div>
                <a href="javascript:void(0);" class="username-link">
                    单亲妈妈
                </a>
            </div>

            <div class="content-col">

                <div>
                    <div class="post-text">
                        作为一个单亲妈妈，孩子交给王教官负责这段时间，我是真的觉得很放心。<br><br>
                        王教官做事特别负责，对孩子也很有耐心，该管的时候认真管，该关心的时候也不会少。平时跟我们沟通的时候也很细致，能感觉出来是真的把孩子的事情放在心上。<br><br>
                        说实话，孩子能遇到这样的教官，我这个当妈妈的也安心很多。
                    </div>

                    <img src="wang.jpg" alt="王教官" class="post-image">
                </div>

                <div class="floor-footer">
                    <div>
                        <span class="client-tail">来自Android客户端</span>
                    </div>

                    <div class="floor-actions">
                        <span>1楼</span>
                        <span>2015-06-15 14:28</span>
                        <span>回复</span>
                    </div>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
