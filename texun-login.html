<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>家长服务中心-登录</title>
<style>
*{
  box-sizing:border-box;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  margin:0;
  font-family:"微软雅黑","宋体",SimSun,Arial,sans-serif;
  background:#e8edf3;
  color:#333;
  font-size:14px;
}

a{
  color:#1a5fa8;
}

/* 顶部 */
.top{
  background:linear-gradient(#3a7bc8,#2a5a9a);
  color:#fff;
  border-bottom:3px solid #1c3f6e;
  box-shadow:0 2px 4px rgba(0,0,0,.25);
}

.top-inner{
  width:960px;
  max-width:100%;
  margin:auto;
  padding:20px 16px;
  text-align:center;
}

.logo{
  font-size:26px;
  line-height:1.4;
  font-weight:bold;
  text-shadow:1px 1px 2px rgba(0,0,0,.4);
}

.sub{
  margin-top:6px;
  font-size:12px;
  line-height:1.5;
  color:#dbe8fb;
}

/* 登录框 */
.box{
  width:440px;
  max-width:calc(100% - 30px);
  margin:50px auto;
  background:#fff;
  border:1px solid #c7d3e0;
  border-radius:4px;
  box-shadow:0 3px 12px rgba(0,0,0,.18);
  overflow:hidden;
}

.box h2{
  margin:0;
  background:linear-gradient(#4a8ad8,#2a5a9a);
  color:#fff;
  padding:12px;
  text-align:center;
  font-size:17px;
  line-height:1.5;
  text-shadow:1px 1px 1px rgba(0,0,0,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2);
  border-radius:4px 4px 0 0;
}

/* 标签 */
.tabs{
  display:flex;
  border-bottom:1px solid #c7d3e0;
}

.tab{
  flex:1;
  min-width:0;
  text-align:center;
  padding:11px 8px;
  cursor:pointer;
  font-weight:bold;
  color:#2a5a9a;
  background:#eef2f8;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

.tab.active{
  background:#fff;
  color:#1c3f6e;
  box-shadow:inset 0 -2px 0 #2a6cc4;
}

/* 表单 */
.form{
  padding:28px 30px;
}

.panel{
  display:none;
}

.panel.active{
  display:block;
}

.row{
  margin:16px 0;
}

.row label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
  color:#2a5a9a;
  font-size:13px;
}

.row input{
  display:block;
  width:100%;
  min-height:42px;
  padding:9px 10px;
  border:1px solid #a9b8ca;
  border-radius:3px;
  font-family:inherit;
  font-size:16px;
  background:#fff;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.12);
  -webkit-appearance:none;
  appearance:none;
}

.row input:focus{
  outline:none;
  border-color:#5aa0e8;
  box-shadow:
    inset 0 1px 3px rgba(0,0,0,.12),
    0 0 0 2px rgba(90,160,232,.25);
}

.hint{
  font-size:12px;
  color:#999;
  margin-top:6px;
  line-height:1.6;
}

/* 登录按钮 */
.submit{
  display:block;
  width:100%;
  min-height:44px;
  padding:11px;
  background:linear-gradient(#5aa0e8,#2a6cc4);
  color:#fff;
  border:1px solid #1c4f8f;
  border-radius:3px;
  font-family:inherit;
  font-weight:bold;
  font-size:15px;
  box-shadow:
    0 2px 4px rgba(0,0,0,.2),
    inset 0 1px 0 rgba(255,255,255,.25);
  text-shadow:1px 1px 1px rgba(0,0,0,.2);
  cursor:pointer;
  margin-top:6px;
  -webkit-appearance:none;
  appearance:none;
}

.submit:hover{
  background:linear-gradient(#6cb0f5,#3a7cd4);
}

.submit:active{
  box-shadow:inset 0 1px 3px rgba(0,0,0,.3);
}

/* 提示框 */
.notice{
  margin-top:16px;
  background:#fff8e1;
  border:1px solid #f0d78c;
  border-radius:3px;
  padding:9px 12px;
  font-size:12px;
  line-height:1.7;
  color:#a15c00;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.05);
}

/* 返回 */
.back{
  text-align:center;
  padding:14px;
  background:linear-gradient(#f4f7fb,#e2e9f2);
  border-top:1px solid #c7d3e0;
  border-radius:0 0 4px 4px;
  font-size:13px;
}


/* ==========================
   平板
========================== */
@media screen and (max-width:768px){

  .top-inner{
    width:100%;
    padding:22px 16px 20px;
  }

  .logo{
    font-size:24px;
  }

  .box{
    margin-top:32px;
    margin-bottom:32px;
  }
}


/* ==========================
   手机端
========================== */
@media screen and (max-width:600px){

  body{
    font-size:14px;
  }

  /* 重点：增加手机端顶部高度 */
  .top{
    min-height:104px;
  }

  .top-inner{
    width:100%;
    min-height:101px;
    padding:23px 14px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  .logo{
    font-size:22px;
    line-height:1.45;
    letter-spacing:.3px;
  }

  .sub{
    margin-top:8px;
    font-size:13px;
    line-height:1.5;
  }

  .box{
    width:auto;
    max-width:none;
    margin:24px 12px 28px;
    border-radius:4px;
  }

  .box h2{
    padding:12px 8px;
    font-size:16px;
  }

  .tab{
    min-height:44px;
    padding:12px 6px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
  }

  .form{
    padding:20px 17px 23px;
  }

  .row{
    margin:15px 0;
  }

  .row label{
    margin-bottom:7px;
    font-size:13px;
  }

  .row input{
    width:100%;
    min-height:46px;
    padding:10px 11px;
    font-size:16px;
  }

  .hint{
    margin-top:6px;
    font-size:12px;
    line-height:1.6;
  }

  .submit{
    min-height:47px;
    padding:11px 8px;
    font-size:15px;
    margin-top:8px;
  }

  .notice{
    margin-top:16px;
    padding:10px 11px;
    font-size:12px;
    line-height:1.7;
  }

  .back{
    min-height:46px;
    padding:14px 10px;
    font-size:13px;
  }
}


/* ==========================
   小尺寸手机
========================== */
@media screen and (max-width:380px){

  .top{
    min-height:98px;
  }

  .top-inner{
    min-height:95px;
    padding:20px 10px 18px;
  }

  .logo{
    font-size:20px;
  }

  .sub{
    margin-top:6px;
    font-size:12px;
  }

  .box{
    margin:18px 8px 24px;
  }

  .form{
    padding:18px 14px 21px;
  }

  .tab{
    font-size:13px;
  }
}
</style></head>
<body>

<div class="top">
  <div class="top-inner">
    <div class="logo">阳光青少年成长特训学校</div>
    <div class="sub">家长服务中心</div>
  </div>
</div>

<div class="box">

<h2 id="boxTitle">家长登录</h2>

<div class="tabs">
  <div class="tab active" id="tabParent" onclick="switchTab('parent')">
    家长登录
  </div>

  <div class="tab" id="tabTeacher" onclick="switchTab('teacher')">
    教师登录
  </div>
</div>

<div class="form">

  <!-- 家长登录 -->
  <div class="panel active" id="panelParent">

    <form onsubmit="return loginParent()">

      <div class="row">
        <label>家长登记编号</label>

        <input
          id="phone"
          type="text"
          placeholder="请输入登记编号"
          required
        >

        <div class="hint">
          请输入报名时生成的家长登记编号，系统将自动验证身份
        </div>
      </div>

      <button class="submit" type="submit">
        登录家长服务中心
      </button>

    </form>

    <div class="notice">
      提示：仅支持已在招生办登记的家长编号登录。
      如编号遗失，请联系招生办公室更新信息。
    </div>

  </div>


  <!-- 教师登录 -->
  <div class="panel" id="panelTeacher">

    <form onsubmit="return loginTeacher()">

      <div class="row">

        <label>教师账号</label>

        <input
          id="teacherUser"
          type="text"
          placeholder="请输入教师账号"
          autocomplete="username"
          required
        >

      </div>

      <div class="row">

        <label>登录密码</label>

        <input
          id="teacherPass"
          type="password"
          placeholder="请输入密码"
          autocomplete="current-password"
          required
        >

        <div class="hint">
          
        </div>

      </div>

      <button class="submit" type="submit">
        登录教师工作台
      </button>

    </form>

    <div class="notice">
      提示：教师账号与内部工号绑定，初始密码为编号的十六进制，请在个人中心更改密码。
    </div>

  </div>

</div>

<div class="back">
  <a href="texunqazwsx.html">返回学校首页</a>
</div>

</div>


<script>

function switchTab(which){

  const isParent = which === 'parent';

  document
    .getElementById('tabParent')
    .classList.toggle('active',isParent);

  document
    .getElementById('tabTeacher')
    .classList.toggle('active',!isParent);

  document
    .getElementById('panelParent')
    .classList.toggle('active',isParent);

  document
    .getElementById('panelTeacher')
    .classList.toggle('active',!isParent);

  document.getElementById('boxTitle').textContent =
    isParent ? '家长登录' : '教师登录';
}


function loginParent(){

  const phone =
    document.getElementById("phone").value.trim();

  const correctAnswer = "CG-PARENT-2008";

  if(phone !== correctAnswer){

    alert("家长编号错误，请重新输入");

    return false;
  }

  localStorage.setItem("parentPhone",phone);

  const params =
    new URLSearchParams(location.search);

  const redirect =
    params.get("redirect") || "texunqazwsx.html";

  location.href = redirect;

  return false;
}


function loginTeacher(){

  if(Number(localStorage.getItem("haijinghua_progress") || 0) < 3){
    alert("教师账号线索尚未解锁。请按顺序查看：看星星的人 → 星星493 → 伤心的太极端了吧。");
    return false;
  }

  const user =
    document.getElementById("teacherUser").value.trim();

  const pass =
    document.getElementById("teacherPass").value.trim();

  /*
    教师账号：
    190714

    190714 转换为十六进制：
    2e8fa
  */

  const correctUser = "JGY-W0714";
  const correctPass = "2e8fa";

  if(user !== correctUser || pass !== correctPass){

    alert("账号或密码错误，请重新输入");

    return false;
  }

  localStorage.setItem("teacherUser",user);

  localStorage.setItem("haijinghua_progress","4");

  location.href = "teac.html";

  return false;
}

if(new URLSearchParams(location.search).get("teacher") === "1"){
  switchTab("teacher");
}

</script>

</body>
</html>
