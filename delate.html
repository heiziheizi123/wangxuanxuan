<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>千度粘吧-提示</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; background-color: #fff; color: #333; }
        
        /* 顶部蓝色导航栏 */
        .tb-header { background: #2d8cf0; height: 40px; display: flex; align-items: center; padding: 0 50px; font-size: 12px; }
        .tb-header a { color: #fff; text-decoration: none; margin-right: 15px; opacity: 0.9; }
        .tb-header a:hover { opacity: 1; text-decoration: underline; }

        /* 搜索框区域 */
        .search-section { width: 100%; max-width: 1000px; margin: 25px auto 0 auto; padding: 0 20px; display: flex; align-items: center; }
        .logo-box { font-size: 26px; font-weight: bold; color: #2d8cf0; margin-right: 20px; text-decoration: none; letter-spacing: -2px; }
        .logo-box span { color: #ff3344; font-size: 20px; font-weight: normal; }
        .search-form-mock { display: flex; flex: 1; max-width: 520px; }
        .search-input-mock { flex: 1; height: 36px; padding: 0 10px; border: 1px solid #ccc; font-size: 14px; outline: none; }
        .search-btn-mock { background: #2d8cf0; color: #fff; border: none; width: 90px; height: 36px; font-size: 14px; font-weight: bold; cursor: default; }

        /* 核心分隔线 */
        .nav-line { width: 100%; max-width: 1000px; margin: 20px auto; border-bottom: 1px solid #e4e6eb; }

        /* 错误提示主体盒 */
        .error-container { width: 100%; max-width: 1000px; margin: 80px auto; padding: 0 20px; display: flex; justify-content: center; }
        .error-content { display: flex; align-items: flex-start; max-width: 550px; }
        
        /* 贴吧标志性大黄脸表情 */
        .error-icon { font-size: 54px; line-height: 1; margin-right: 24px; margin-top: -4px; user-select: none; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.08)); }
        
        /* 提示文字 */
        .error-text-box { flex: 1; }
        .error-title { font-size: 20px; font-weight: bold; color: #333; margin-bottom: 12px; font-family: "Microsoft YaHei", sans-serif; }
        .error-reason { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 25px; }
        
        /* 贴吧特色跳转按钮 */
        .btn-group { display: flex; gap: 10px; }
        .tb-btn { display: inline-block; padding: 0 16px; height: 32px; line-height: 31px; font-size: 13px; border-radius: 2px; text-decoration: none; text-align: center; }
        .btn-blue { background: #2d8cf0; color: #fff; border: 1px solid #2d8cf0; font-weight: bold; }
        .btn-blue:hover { background: #1871d6; }
        .btn-white { background: #fcfcfc; color: #666; border: 1px solid #e4e6eb; }
        .btn-white:hover { background: #f5f6fa; border-color: #ccc; }
    </style>
</head>
<body>

    <div class="tb-header">
        <a href="javascript:void(0);">网页</a>
        <a href="javascript:void(0);">资讯</a>
        <a href="javascript:void(0);">视频</a>
        <a href="javascript:void(0);">图片</a>
        <a href="javascript:void(0);">知道</a>
        <a href="javascript:void(0);" style="font-weight: bold;">粘吧</a>
    </div>

    <div class="search-section">
        <a href="javascript:void(0);" class="logo-box">粘吧</a>
        <div class="search-form-mock">
            <input type="text" class="search-input-mock" value="" disabled placeholder="集成式精准检索...">
            <button class="search-btn-mock">全吧搜索</button>
        </div>
    </div>

    <div class="nav-line"></div>

    <div class="error-container">
        <div class="error-content">
            <div class="error-icon">😢</div>
            <div class="error-text-box">
                <h1 class="error-title">很抱歉，该贴子已被删除。</h1>
                <p class="error-reason">您访问的贴子可能由于违反《粘吧协议》已被吧主或系统管理员删除，或者该贴子由原作者自行删除。您可以尝试返回粘吧上一页或继续浏览其他精彩内容。</p>
                
                <div class="btn-group">
                    <a href="javascript:history.back();" class="tb-btn btn-blue">返回上一页</a>
                    <a href="search.html" class="tb-btn btn-white">返回搜索页</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
